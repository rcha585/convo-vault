version: "0.2"

# Copy this file to a private, Git-ignored config and replace synthetic paths.
sources:
  - collection: my-writing
    path: D:/Knowledge/My Writing
    source_class: personal-work
    ownership: user-authored
    privacy: private
    source_mode: external-index
    allowed_uses: [archive, search, retrieval, style-analysis]
    training_policy: review-required

  - collection: research-library
    path: D:/Knowledge/Research
    source_class: research-report
    ownership: third-party
    privacy: private
    source_mode: external-index
    allowed_uses: [archive, search, retrieval, summarize]
    training_policy: retrieval-only
